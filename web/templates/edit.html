{% extends 'base.html' %}{% block content %}<section class="form-page"><h1>Corrigir a extração</h1><p>Confira cada trecho com o arquivo de origem. Estas correções ficam registradas; não alteram o arquivo enviado.</p><form method="post">{% csrf_token %}{% for b in doc.content.blocks %}{% if b.kind != 'table' %}<p><label for="{{ b.id }}">{{ b.id }} · {{ b.origin }}{% if b.kind == 'image' %} · descrição da imagem{% endif %}</label><textarea id="{{ b.id }}" name="{{ b.id }}" rows="5">{{ b.text }}</textarea></p>{% endif %}{% endfor %}<button>Salvar correções</button></form></section>{% endblock %}
