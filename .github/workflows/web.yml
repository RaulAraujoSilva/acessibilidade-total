name: aplicação web
on:
  push:
    branches: [main, feat/sistema-documentos-ia]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r web/requirements.txt
      - run: python web/local.py test studio
